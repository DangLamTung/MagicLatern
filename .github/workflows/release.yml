# Release CD: tag -> firmware artefacts.
#
# This lives in the root repo because build.sh, the toolchain checkout and the
# magiclantern/ tree all live here; magiclantern/ itself is a separate repo with
# its own CI (host tests + romfind unit tests) and is cloned in below.
#
# Every step is in ci/release-build.sh, so a failed run here can be reproduced
# on a Mac with `./ci/release-build.sh` instead of guessed at.
#
#   git tag v1.2.0 && git push --tags      -> builds, tests, publishes a release

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.2.0); empty means build only'
        required: false
      module_ref:
        description: 'MagicLatern-ML branch, tag or sha to build'
        required: false
        default: dev

permissions:
  contents: write

jobs:
  build:
    # macos-26 is the current arm64 macOS image; macos-14 was retired from
    # GitHub-hosted runners, and asking for a retired label fails the whole run
    # in one second with "The configuration 'macos-14-arm64-us-default' is not
    # supported". build.sh needs Darwin, sysctl and BSD stat.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build, test and package
        env:
          DOWNLOAD_TOOLCHAIN: '1'
          MODULE_REF: ${{ github.event.inputs.module_ref || 'dev' }}
        run: ./ci/release-build.sh

      - name: Upload the artefacts
        uses: actions/upload-artifact@v4
        with:
          name: magiclantern-6D.116
          path: dist/
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # The notes are written by the build script, so what a release says is
          # the same text whether it was published from CI or by hand.
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --generate-notes \
            --notes-file dist/RELEASE-NOTES.md

          # The .mo hashes move with every commit: the module embeds its build
          # revision, so two builds of the same tree match and two different
          # commits never do.
